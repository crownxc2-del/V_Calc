<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartphone Calculator</title>
<link rel="icon" href="icon.json">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.calculator {
    width: 360px;
    height: 650px;
    background: #000;
    border-radius: 30px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.display {
    height: 200px;
    padding: 30px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

.history {
    font-size: 18px;
    opacity: 0.6;
    min-height: 24px;
    text-align: right;
}

.output {
    font-size: 48px;
    min-height: 64px;
    text-align: right;
}

.keys {
    flex: 1;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.key {
    border: none;
    border-radius: 20px;
    font-size: 28px;
    cursor: pointer;
    background: #333;
    color: white;
}

.key:active {
    transform: scale(0.95);
}

.function {
    background: #555;
}

.operator {
    background: linear-gradient(45deg, #ff9500, #ff6b00);
}

.equals {
    background: linear-gradient(45deg, #00c851, #00a741);
}

.clear {
    background: linear-gradient(45deg, #ff4444, #cc0000);
}
</style>
</head>

<body>

<div class="calculator">
    <div class="display">
        <div class="history" id="history"></div>
        <div class="output" id="output">0</div>
    </div>

    <div class="keys">
        <button class="key clear" id="clear">AC</button>
        <button class="key function" id="backspace">⌫</button>
        <button class="key function" id="mod">%</button>
        <button class="key operator" id="divide">÷</button>

        <button class="key" id="7">7</button>
        <button class="key" id="8">8</button>
        <button class="key" id="9">9</button>
        <button class="key operator" id="multiply">×</button>

        <button class="key" id="4">4</button>
        <button class="key" id="5">5</button>
        <button class="key" id="6">6</button>
        <button class="key operator" id="subtract">−</button>

        <button class="key" id="1">1</button>
        <button class="key" id="2">2</button>
        <button class="key" id="3">3</button>
        <button class="key operator" id="add">+</button>

        <button class="key" id="0">0</button>
        <button class="key" id=".">.</button>
        <button class="key equals" id="equals">=</button>
    </div>
</div>

<script>
class Calculator {
    constructor() {
        this.history = null;
        this.output = '0';
        this.operator = null;
        this.waiting = false;

        this.historyEl = document.getElementById('history');
        this.outputEl = document.getElementById('output');

        document.querySelectorAll('.key').forEach(btn => {
            btn.addEventListener('click', () => this.handle(btn.id));
        });

        this.update();
    }

    handle(key) {
        if (/\d/.test(key)) return this.digit(key);

        switch (key) {
            case 'clear': return this.clear();
            case 'backspace': return this.backspace();
            case '.': return this.decimal();
            case 'add':
            case 'subtract':
            case 'multiply':
            case 'divide': return this.setOperator(key);
            case 'mod': return this.setOperator('mod');
            case 'equals': return this.equals();
        }
    }

    digit(num) {
        if (this.waiting) {
            this.output = num;
            this.waiting = false;
        } else {
            this.output = this.output === '0' ? num : this.output + num;
        }
        this.update();
    }

    decimal() {
        if (!this.output.includes('.')) {
            this.output += '.';
            this.update();
        }
    }

    setOperator(op) {
        const value = parseFloat(this.output);
        if (this.history === null) {
            this.history = value;
        } else {
            this.history = this.compute(this.operator, this.history, value);
        }
        this.operator = op;
        this.waiting = true;
        this.update();
    }

    equals() {
        if (this.operator === null) return;
        this.history = this.compute(this.operator, this.history, parseFloat(this.output));
        this.output = String(this.history);
        this.operator = null;
        this.history = null;
        this.waiting = true;
        this.update();
    }

    compute(op, a, b) {
        if (op === 'add') return a + b;
        if (op === 'subtract') return a - b;
        if (op === 'multiply') return a * b;
        if (op === 'divide') return b === 0 ? 0 : a / b;
        if (op === 'mod') return a % b;
    }

    backspace() {
        this.output = this.output.length > 1 ? this.output.slice(0, -1) : '0';
        this.update();
    }

    clear() {
        this.output = '0';
        this.history = null;
        this.operator = null;
        this.waiting = false;
        this.update();
    }

    update() {
        this.outputEl.textContent = this.output;
        this.historyEl.textContent = this.history ?? '';
    }
}

new Calculator();
</script>

</body>
  </html>
